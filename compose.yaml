services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: career_quest
      POSTGRES_USER: career
      POSTGRES_PASSWORD: career-local-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U career -d career_quest"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://career:career-local-only@postgres:5432/career_quest
      REDIS_URL: redis://redis:6379/0
      DATASET_PATH: /data
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    volumes:
      - ./career_quest_dataset:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
